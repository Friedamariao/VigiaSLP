services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - ../../.env.example
    volumes:
      - ./backend:/app/backend

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
