# Entorno de VigíaSLP: base de datos geoespacial y API central (E01).
# Uso: docker compose up   (Swagger en http://localhost:8000/docs)
services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigiaslp}
      POSTGRES_USER: ${POSTGRES_USER:-vigia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_local}
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigia} -d ${POSTGRES_DB:-vigiaslp}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigiaslp}
      POSTGRES_USER: ${POSTGRES_USER:-vigia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_local}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      OFUSCACION_DECIMALES: ${OFUSCACION_DECIMALES:-3}
      CORS_ORIGENES: ${CORS_ORIGENES:-*}
      AUTH_MODO: ${AUTH_MODO:-off}
    ports:
      - "${API_PORT:-8000}:8000"
volumes:
  pgdata:
